server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads for georeferencing images (up to 100MB)
    client_max_body_size 100M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               application/vnd.mapbox-vector-tile;

    # NOTE: CORS headers are added per-location, NOT globally
    # This prevents duplicate headers when proxying to backend (which adds its own CORS)

    # MIME types for PMTiles and related formats
    types {
        application/vnd.mapbox-vector-tile mvt;
        application/octet-stream pmtiles;
        application/geo+json geojson;
        application/json json;
        text/html html htm;
        text/css css;
        text/javascript js mjs;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg svgz;
    }

    # Cache headers for tiles and static assets
    location ~* \.(pmtiles|mvt|pbf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        # Support range requests for PMTiles
        add_header Accept-Ranges bytes;
        # Disable gzip for pmtiles - required for byte-range requests
        gzip off;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # API proxy to backend
    # Backend handles its own CORS headers via FastAPI middleware
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;  # /api/rebuild runs normalize+merge+export synchronously
    }

    # WMS proxy for Trondheim kommune (avoids CORS)
    location /wms/trondheim/ {
        proxy_pass https://kart.trondheim.kommune.no/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Host kart.trondheim.kommune.no;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # WMS proxy for Geonorge (avoids CORS)
    location /wms/geonorge/ {
        proxy_pass https://wms.geonorge.no/skwms1/;
        proxy_http_version 1.1;
        proxy_set_header Host wms.geonorge.no;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Specific handling for data directory
    # Files are versioned via ?v=hash query params, so we can cache aggressively
    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;

        # Aggressive caching - versioned URLs ensure fresh content
        # manifest.json is always fetched with cache-busting timestamp
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Disable gzip for pmtiles - required for byte-range requests
        gzip off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
