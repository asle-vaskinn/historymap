[pytest]
# conftest.py adds scripts/ to sys.path, so no PYTHONPATH is required here.
# Plain `pytest` runs the FULL suite — keep it that way (do NOT add --testmon to
# addopts, or the pre-commit full run would be silently scoped). Scoped iteration
# goes through the [pytest-watch] runner or an explicit `--testmon` / `--lf`.
testpaths = tests
addopts = -ra
markers =
    unit: fast, isolated unit tests
    integration: cross-module / IO-touching tests

[pytest-watch]
# `ptw` is the default iteration loop: on every save it re-runs ONLY the tests
# affected by the change (pytest-testmon), so feedback stays scoped and fast.
runner = python3 -m pytest --testmon
clear = True
