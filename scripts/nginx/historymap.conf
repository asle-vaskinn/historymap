# nginx vhost for historymap — tenant #3 on the shared Hetzner VPS.
# Static-only: serves the frontend, the generated /data/ artifacts (PMTiles +
# GeoJSON) with HTTP Range and gzip OFF, the two external WMS proxies, and a
# /version endpoint the deploy workflow polls. No /api/ — the FastAPI job queue
# is a dev/admin tool and is not exposed in public prod.
#
# certbot --nginx rewrites this file in place to add the :443 server blocks and
# the http->https redirect on first issuance; deploy_vps.sh only re-applies from
# the repo when this source file changes, preserving those additions.

server {
    listen 80;
    server_name historymap.vaskinn.eu;
    root /opt/historymap/frontend;
    index index.html;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               application/vnd.mapbox-vector-tile;

    types {
        application/vnd.mapbox-vector-tile mvt;
        application/octet-stream pmtiles;
        application/geo+json geojson;
        application/json json;
        text/html html htm;
        text/css css;
        text/javascript js mjs;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg svgz;
        text/plain txt;
    }

    # Deploy verification endpoint — deploy_vps.sh writes the short SHA here.
    location = /version {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        alias /opt/historymap/frontend/version.txt;
    }

    location ~* \.(pmtiles|mvt|pbf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        gzip off;   # required for byte-range requests
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # WMS proxy for Trondheim kommune (avoids CORS)
    location /wms/trondheim/ {
        proxy_pass https://kart.trondheim.kommune.no/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Host kart.trondheim.kommune.no;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # WMS proxy for Geonorge (avoids CORS)
    location /wms/geonorge/ {
        proxy_pass https://wms.geonorge.no/skwms1/;
        proxy_http_version 1.1;
        proxy_set_header Host wms.geonorge.no;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Generated data artifacts (PMTiles + GeoJSON). gzip OFF + Range so PMTiles
    # byte-range requests work. autoindex off. Files are uploaded by
    # scripts/sync_data.sh with mode 644 so the nginx worker can always read them.
    location /data/ {
        alias /opt/historymap/data/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
