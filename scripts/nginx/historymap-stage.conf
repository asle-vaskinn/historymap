# nginx vhost for the historymap STAGING tenant on the shared Hetzner VPS.
# Identical to historymap.conf but bound to stage.historymap.vaskinn.eu and
# /opt/historymap-stage. Deployed by deploy-stage.yml (PR labeled `staging`)
# via: SITE=historymap-stage APP_DIR=/opt/historymap-stage bash scripts/deploy_vps.sh <branch>

server {
    listen 80;
    server_name stage.historymap.vaskinn.eu;
    root /opt/historymap-stage/frontend;
    index index.html;

    client_max_body_size 100M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               application/vnd.mapbox-vector-tile;

    types {
        application/vnd.mapbox-vector-tile mvt;
        application/octet-stream pmtiles;
        application/geo+json geojson;
        application/json json;
        text/html html htm;
        text/css css;
        text/javascript js mjs;
        image/png png;
        image/jpeg jpg jpeg;
        image/svg+xml svg svgz;
        text/plain txt;
    }

    location = /version {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        alias /opt/historymap-stage/frontend/version.txt;
    }

    location ~* \.(pmtiles|mvt|pbf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        gzip off;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /wms/trondheim/ {
        proxy_pass https://kart.trondheim.kommune.no/geoserver/;
        proxy_http_version 1.1;
        proxy_set_header Host kart.trondheim.kommune.no;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /wms/geonorge/ {
        proxy_pass https://wms.geonorge.no/skwms1/;
        proxy_http_version 1.1;
        proxy_set_header Host wms.geonorge.no;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_cache_valid 200 1d;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /data/ {
        alias /opt/historymap-stage/data/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
