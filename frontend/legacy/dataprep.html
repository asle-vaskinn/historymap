<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Prep - Trondheim Historical Map</title>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

    <link rel="stylesheet" href="dataprep.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-link">&larr; Back</a>
            <h1>Data Prep</h1>
        </div>
        <div class="header-right">
            <span id="status">Loading sources...</span>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Control Panel -->
        <aside class="control-panel">
            <!-- Focus Layer (Overlay) -->
            <section class="panel-section">
                <h2>Focus Layer</h2>
                <div id="focusList" class="radio-list">
                    <!-- Populated by JavaScript -->
                </div>
                <div class="opacity-control">
                    <label for="focusOpacity">Opacity:</label>
                    <input type="range" id="focusOpacity" min="0" max="100" value="70">
                    <span id="opacityValue">70%</span>
                </div>
            </section>

            <!-- Reference Layer (Background) -->
            <section class="panel-section">
                <h2>Reference Layer</h2>
                <select id="referenceSelect" class="layer-select">
                    <!-- Populated by JavaScript -->
                </select>
            </section>

            <!-- Info Section -->
            <section class="panel-section">
                <h2>Info</h2>
                <div id="infoPanel" class="info-content">
                    <p>Select a source to see details.</p>
                </div>
            </section>

            <!-- Source List Section -->
            <section class="panel-section">
                <h2>Sources</h2>
                <div id="sourceList" class="source-list">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </aside>

        <!-- Map Container -->
        <div id="map" class="map-container"></div>
    </div>

    <script src="dataprep.js"></script>
</body>
</html>
